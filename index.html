<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RATATAA LEAGUE</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1 {
  padding:20px;
}

button {
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#22c55e;
  color:white;
  cursor:pointer;
  margin-bottom:20px;
}

.players {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.1);
  padding:20px;
  border-radius:10px;
  transition:0.3s;
}

.card:hover {
  transform:scale(1.05);
}

ul {
  list-style:none;
  padding:0;
}
</style>

</head>

<body>

<h1>RATATAA 🔥</h1>

<button onclick="showMessage()">Click Me 🔥</button>

<h2>Players</h2>

<div class="players">
  <div class="card">Sahin</div>
  <div class="card">Mahashin</div>
  <div class="card">Nasim</div>
  <div class="card">Khokan</div>
</div>

<h2>Leaderboard</h2>
<ul id="board"></ul>

<script>
function showMessage(){
  alert("Welcome to RATATAA LEAGUE 🔥");
}

const players = [
  {name:"Sahin", score:120},
  {name:"Mahashin", score:95},
  {name:"Nasim", score:110},
  {name:"Khokan", score:80}
];

players.sort((a,b)=>b.score-a.score);

const board = document.getElementById("board");

players.forEach((p,i)=>{
  const li = document.createElement("li");
  li.innerText = (i+1)+". "+p.name+" - "+p.score;
  board.appendChild(li);
});
</script>

</body>
</html>
