<!DOCTYPE html>
<html>
<head>
<title>RATATAA LEAGUE</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
  text-align:center;
}

h1 {
  padding:20px;
}

.players {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
  gap:15px;
  padding:20px;
}

.card {
  background:rgba(255,255,255,0.1);
  padding:20px;
  border-radius:10px;
}

</style>
</head>

<body>

<h1>RATATAA 🔥</h1>

<h2>Players</h2>

<div class="players">
  <div class="card">Sahin</div>
  <div class="card">Mahashin</div>
  <div class="card">Nasim</div>
  <div class="card">Khokan</div>
</div>

<h2>Leaderboard</h2>
<ul id="board"></ul>

<script>
const players = [
  {name:"Sahin", score:120},
  {name:"Mahashin", score:95},
  {name:"Nasim", score:110},
  {name:"Khokan", score:80}
];

players.sort((a,b)=>b.score-a.score);

const board = document.getElementById("board");

players.forEach((p,i)=>{
  const li = document.createElement("li");
  li.innerText = (i+1)+". "+p.name+" - "+p.score;
  board.appendChild(li);
});
</script>

</body>
</html>
