<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RATATAA LEAGUE</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #020617);
  color:white;
  text-align:center;
}

/* Title */
h1 {
  padding:20px;
  font-size:32px;
}

/* Button */
button {
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(45deg,#22c55e,#4ade80);
  color:white;
  cursor:pointer;
  font-weight:bold;
  transition:0.3s;
}

button:hover {
  transform:scale(1.1);
}

/* Players */
.players {
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(180px,1fr));
  gap:20px;
  padding:20px;
}

/* Cards */
.card {
  background: rgba(255,255,255,0.08);
  padding:25px;
  border-radius:15px;
  transition:0.4s;
  box-shadow:0 0 0 transparent;
}

.card:hover {
  transform: translateY(-10px) scale(1.05);
  box-shadow:0 0 20px rgba(34,197,94,0.5);
}

/* Leaderboard */
ul {
  list-style:none;
  padding:0;
}

li {
  background:rgba(255,255,255,0.08);
  margin:10px auto;
  padding:12px;
  border-radius:10px;
  width:200px;
  transition:0.3s;
}

li:hover {
  background:rgba(255,255,255,0.15);
  transform:scale(1.05);
}
</style>

</head>

<body>

<h1>🔥 RATATAA LEAGUE 🔥</h1>

<button onclick="showMessage()">Enter League</button>

<h2>Players</h2>

<div class="players">
  <div class="card">🔥 Sahin<br>Leader</div>
  <div class="card">⚡ Mahashin<br>Attacker</div>
  <div class="card">🎯 Nasim<br>Sniper</div>
  <div class="card">🛡 Khokan<br>Defender</div>
</div>

<h2>🏆 Leaderboard</h2>
<ul id="board"></ul>

<script>
function showMessage(){
  alert("Welcome to RATATAA LEAGUE 🔥");
}

const players = [
  {name:"Sahin", score:120},
  {name:"Mahashin", score:95},
  {name:"Nasim", score:110},
  {name:"Khokan", score:80}
];

players.sort((a,b)=>b.score-a.score);

const board = document.getElementById("board");

players.forEach((p,i)=>{
  const li = document.createElement("li");
  li.innerText = (i+1) + ". " + p.name + " - " + p.score;
  board.appendChild(li);
});
</script>

</body>
</html>
